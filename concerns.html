<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Concerns - VMC Nexus</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
    <a href="index.html" class="navbar-logo"><img src="./image/navi-barlogo1.jpg" alt="VMC Nexus Logo"></a>
    <nav>
        <a href="index.html">Home</a>
        <a href="announcement.html">Announcements</a>
        <a href="concerns.html" class="active">Concerns</a>
        <a href="scholarship.html">Scholarship</a>
        <a href="library.html">Library</a>
        <a href="freedom.html">Freedom Wall</a>
        <a href="login.html" class="login-btn">Login</a>
    </nav>
</header>

<div class="page-container">
    <div class="page-header">
        <h1>School Concerns</h1>
        <p>Submit your concerns directly to campus administration.</p>
    </div>

    <div class="form-card">
        <form onsubmit="return submitConcern(event)">
            <label for="studentName">Student Name</label>
            <input type="text" id="studentName" placeholder="Enter your full name" required>

            <label for="category">Category</label>
            <select id="category" required>
                <option value="Academic">Academic</option>
                <option value="Facilities">Facilities</option>
                <option value="Financial">Financial</option>
                <option value="General">General</option>
            </select>

            <label for="concernSubject">Subject</label>
            <input type="text" id="concernSubject" placeholder="Brief subject" required>

            <label for="concernMessage">Concern Details</label>
            <textarea id="concernMessage" rows="5" placeholder="Explain your concern in detail..." required></textarea>

            <button type="submit" class="main-btn">SUBMIT CONCERN</button>
        </form>
    </div>

    <div class="page-header" style="margin-top: 40px;">
        <h2>Submitted Concerns</h2>
    </div>
    <div id="concernList"></div>
</div>

<footer><p>© 2026 VMC Nexus | Student Services System</p></footer>
<script src="js/script.js"></script>
</body>
</html>
