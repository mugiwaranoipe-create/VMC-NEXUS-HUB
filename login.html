<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - VMC Nexus</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

<div class="login-container">

    <div class="login-left">
        <div class="logo">VMC <span>NEXUS</span></div>

        <h1>Welcome Back!</h1>

        <p>
            Login to access the VMC Nexus Student Services System.
        </p>

        <ul>
            <li>📢 School Announcements</li>
            <li>📝 School Concerns</li>
            <li>🎓 Scholarship Information</li>
            <li>📚 Library Services</li>
            <li>💬 Freedom Wall</li>
        </ul>
    </div>

    <div class="login-box">

        <h2>Login</h2>
        <p class="login-subtitle">Enter your account details</p>

        <form onsubmit="login(event)">

            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>

            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button
                    type="button"
                    onclick="showPassword()"
                    id="showButton">
                    SHOW
                </button>

            </div>

            <button type="submit" class="login-button">
                LOGIN
            </button>

        </form>

        <p id="login-message"></p>

        <a href="index.html" class="back-link">
            ← Back to Home
        </a>

    </div>

</div>

<script src="js/script.js"></script>

</body>
</html>
