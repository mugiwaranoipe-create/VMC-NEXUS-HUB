<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - VMC Nexus</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

<div class="login-container">
    <div class="login-left">
        <div class="navbar-logo" style="margin-bottom: 20px;">
            <a href="index.html">
                <img src="./image/hero-logo1.png" alt="VMC Nexus Logo" style="width: 140px; height: auto;">
            </a>
        </div>
        <h1>Welcome!</h1>
        <p>Login to access the VMC Nexus Student Services System.</p>
        <ul>
            <li>📢 School Announcements</li>
            <li>📝 School Concerns</li>
            <li>🎓 Scholarship Information</li>
            <li>📚 Library Services</li>
            <li>💬 Freedom Wall</li>
        </ul>
    </div>

    <div class="login-box">
        <h2>Login</h2>
        <p class="login-subtitle">Enter your account details</p>

        <form onsubmit="return login(event)">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="e.g. bhet@vmc.com" required>

            <label for="password">Password</label>
            <div class="password-box">
                <input type="password" id="password" placeholder="Enter your password" required>
                <button type="button" onclick="showPassword()" id="showButton">SHOW</button>
            </div>

            <button type="submit" class="login-button">LOGIN</button>
        </form>

        <p id="login-message" style="margin-top: 12px; font-size: 13px; font-weight: bold;"></p>

        <p style="margin-top: 15px; font-size: 13px; color: #94a3b8;">
            Don't have an account? 
            <a href="register.html" style="color: #4da3ff; text-decoration: none; font-weight: bold;">Register Account</a>
        </p>

        <a href="index.html" class="back-link">← Back to Home</a>
    </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
