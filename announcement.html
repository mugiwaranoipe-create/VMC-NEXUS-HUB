<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements - VMC Nexus</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
    <a href="index.html" class="navbar-logo">
        <img src="./image/navi-barlogo1.jpg" alt="VMC Nexus Navbar Logo">
    </a>
    <nav>
        <a href="index.html">Home</a>
        <a href="announcement.html" class="active">Announcements</a>
        <a href="concerns.html">Concerns</a>
        <a href="scholarship.html">Scholarship</a>
        <a href="library.html">Library</a>
        <a href="freedom.html">Freedom Wall</a>
        <a href="login.html" class="login-btn">Login</a>
    </nav>
</header>

<main class="page-container">
    <div class="page-header">
        <h1>📢 School Announcements</h1>
        <p>Important updates and announcements for students. Click any announcement to read more.</p>
    </div>

    <!-- Announcement Cards Container -->
    <div id="announcementList">
        <!-- Dynamically populated via js/script.js -->
    </div>
</main>

<!-- Modal Popup for Full Announcement Details -->
<div id="announcementModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 9, 20, 0.85); z-index: 2000; justify-content: center; align-items: center; padding: 20px;">
    <div style="background: #081120; border: 1px solid rgba(77, 163, 255, 0.3); border-radius: 12px; padding: 30px; max-width: 550px; width: 100%; box-shadow: 0 15px 35px rgba(0,0,0,0.5);">
        <small id="modalDate" style="color: #64748b; display: block; margin-bottom: 5px;"></small>
        <h2 id="modalTitle" style="color: #4da3ff; margin-bottom: 15px; font-size: 22px;"></h2>
        <p id="modalBody" style="color: #cbd5e1; font-size: 14px; line-height: 1.6; margin-bottom: 25px;"></p>
        <button onclick="closeAnnouncementModal()" style="background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%;">Close</button>
    </div>
</div>

<footer>
    <p>© 2026 VMC Nexus | Student Services System</p>
</footer>

<script src="js/script.js"></script>
</body>
</html>
