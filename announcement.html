<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements - VMC Nexus</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .announcement-card {
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .announcement-card:hover {
            transform: translateY(-3px);
            border-color: rgba(77, 163, 255, 0.4);
        }
        /* MODAL POPUP STYLES */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 9, 20, 0.85);
            backdrop-filter: blur(4px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            background: #081120;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
        }
        .close-modal:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

<header class="navbar">
    <a href="index.html" class="navbar-logo">
        <img src="./image/navi-barlogo1.jpg" alt="VMC Nexus Navbar Logo">
    </a>
    <nav>
        <a href="index.html">Home</a>
        <a href="announcement.html" class="active">Announcements</a>
        <a href="concerns.html">Concerns</a>
        <a href="scholarship.html">Scholarship</a>
        <a href="library.html">Library</a>
        <a href="freedom.html">Freedom Wall</a>
        <a href="login.html" class="login-btn">Login</a>
    </nav>
</header>

<main class="page-container">
    <div class="page-header">
        <h1>📢 School Announcements</h1>
        <p>Click any announcement below to view complete details.</p>
    </div>

    <!-- Container where announcements are loaded -->
    <div id="announcementList">
        <!-- Dynamically rendered via script.js -->
    </div>
</main>

<!-- ANNOUNCEMENT DETAILS MODAL -->
<div class="modal-overlay" id="announcementModal">
    <div class="modal-content">
        <button class="close-modal" onclick="closeAnnouncementModal()">&times;</button>
        <small id="modalDate" style="color: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 8px;"></small>
        <h2 id="modalTitle" style="color: #4da3ff; margin-bottom: 15px; font-size: 22px;"></h2>
        <div id="modalBody" style="color: #cbd5e1; font-size: 15px; line-height: 1.7; white-space: pre-line;"></div>
        <button class="main-btn" onclick="closeAnnouncementModal()" style="margin-top: 25px;">Close</button>
    </div>
</div>

<footer>
    <p>© 2026 VMC Nexus | Student Services System</p>
</footer>

<script src="js/script.js"></script>
</body>
</html>
