<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freedom Wall - VMC Nexus</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
    <a href="index.html" class="navbar-logo">
        <img src="./image/navi-barlogo1.jpg" alt="VMC Nexus Navbar Logo">
    </a>
    <nav>
        <a href="index.html">Home</a>
        <a href="announcement.html">Announcements</a>
        <a href="concerns.html">Concerns</a>
        <a href="scholarship.html">Scholarship</a>
        <a href="library.html">Library</a>
        <a href="freedom.html" class="active">Freedom Wall</a>
        <a href="login.html" class="login-btn">Login</a>
    </nav>
</header>

<main class="page-container">
    <div class="page-header">
        <h1>💬 Student Freedom Wall</h1>
        <p>Share your thoughts, greetings, or anonymous notes with the student body.</p>
    </div>

    <div class="form-card">
        <h2 style="color: #4da3ff; margin-bottom: 15px; font-size: 20px;">Post a Message</h2>
        <form onsubmit="return postMessage(event)">
            <label for="wallName">Name / Alias</label>
            <input type="text" id="wallName" placeholder="Your name or Anonymous" required>

            <label for="wallMessage">Your Message</label>
            <textarea id="wallMessage" rows="3" placeholder="Write your message here..." required></textarea>

            <button type="submit" class="main-btn">Post to Wall</button>
        </form>
    </div>

    <div class="form-card">
        <h2 style="color: #4da3ff; margin-bottom: 15px; font-size: 20px;">Recent Messages</h2>
        <div id="wallPosts">
            <!-- Dynamically populated via script.js -->
        </div>
    </div>
</main>

<footer>
    <p>© 2026 VMC Nexus | Student Services System</p>
</footer>

<script src="js/script.js"></script>
</body>
</html>
