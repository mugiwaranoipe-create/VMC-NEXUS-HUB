<header class="navbar">

<div class="page-container">
    <div class="page-header">
        <h1>Student Freedom Wall</h1>
        <p>Share your thoughts, messages, and reflections with fellow students.</p>
    </div>

    <div class="form-card">
        <form onsubmit="return postMessage(event)">
            <label for="wallName">Your Name / Alias</label>
            <input type="text" id="wallName" placeholder="Enter name or stay anonymous" required>

            <label for="wallMessage">Your Message</label>
            <textarea id="wallMessage" rows="4" placeholder="Write something positive..." required></textarea>

            <button type="submit" class="main-btn">POST MESSAGE</button>
        </form>
    </div>

    <div id="wallPosts" style="margin-top: 30px;"></div>
</div>

<footer><p>© 2026 VMC Nexus | Student Services System</p></footer>
<script src="js/script.js"></script>
