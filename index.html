        /* LEFT SIDE */

        .left {

        .features p {
            margin: 12px 0;

        /* RIGHT SIDE */

        .right {
            width: 50%;

            padding: 55px;

            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .right h2 {
            font-size: 30px;
            color: #0f172a;

            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 28px;
        }

        label {
            display: block;

            font-weight: bold;

            color: #334155;

            margin-bottom: 7px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input {
            width: 100%;

            padding: 14px;

            border: 1px solid #cbd5e1;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #0284c7;

            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12);
        }

        /* PASSWORD */

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 70px;
        }

        .show {
            position: absolute;

            right: 12px;
            top: 50%;

            transform: translateY(-50%);

            color: #0284c7;

            cursor: pointer;

            font-size: 13px;

            font-weight: bold;
        }

        /* BUTTON */

        .login-button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #0284c7;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }

        .login-button:hover {
            background: #0369a1;
        }

        /* REGISTER */

        .register {
            text-align: center;

            margin-top: 22px;

            color: #64748b;

            font-size: 14px;
        }

        .register a {
            color: #0284c7;

            font-weight: bold;

            text-decoration: none;
        }

        .register a:hover {
            text-decoration: underline;
        }

        /* FOOTER */

        .footer {
            text-align: center;

            margin-top: 25px;

            color: #94a3b8;

            font-size: 12px;
        }
